<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | Admin Dynamic Check-in</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: { 500: '#8b5cf6', 600: '#7c3aed' },
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .yoga-gradient { background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%); }
    </style>
</head>
<body class="bg-dark-900 text-white font-sans selection:bg-yoga-500/20" x-data="adminCheckin()">

    <!-- Header -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 yoga-gradient rounded-xl flex items-center justify-center font-bold shadow-lg">N</div>
            <span class="font-display font-bold text-xl tracking-tight">Admin Attendance</span>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-white transition-all">Back to App</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left: Class Selection & QR -->
        <section class="space-y-6">
            <div class="glass p-8 rounded-[2.5rem]">
                <h2 class="text-2xl font-display font-bold mb-6 text-yoga-400">Pilih Sesi Kelas</h2>
                <div class="space-y-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Nama Kelas</label>
                    <select x-model="selectedClassId" @change="stopAttendanceSync()" class="w-full bg-dark-900 border border-gray-700 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-yoga-500 transition-all outline-none text-sm">
                        <option value="">-- Pilih Kelas --</option>
                        <template x-for="cls in classes" :key="cls.id">
                            <option :value="cls.id" x-text="`${cls.title} (${cls.formatted_time})`"></option>
                        </template>
                    </select>
                    
                    <button @click="generateToken()" :disabled="!selectedClassId || loading" class="w-full yoga-gradient py-5 rounded-[1.5rem] font-bold text-white shadow-xl shadow-yoga-500/20 active:scale-95 transition-all mt-4 flex items-center justify-center gap-3">
                        <span x-show="loading" class="animate-spin border-2 border-white border-t-transparent rounded-full h-5 w-5"></span>
                        <span x-text="token ? 'Regenerate QR' : 'Generate QR Check-in'"></span>
                    </button>
                </div>
            </div>

            <!-- QR Display -->
            <div x-show="token" x-transition class="glass p-10 rounded-[3rem] text-center flex flex-col items-center">
                <h3 class="text-xl font-bold mb-2">Scan untuk Check-in</h3>
                <p class="text-gray-400 text-sm mb-8" x-text="`Sesi: ${selectedClassTitle}`"></p>
                
                <div id="qrcode-container" class="bg-white p-6 rounded-[2rem] shadow-2xl mb-8"></div>
                
                <div class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-yoga-500">
                    <span class="animate-pulse">● LIVE</span>
                    <span class="text-gray-500" x-text="`Token: ${token}`"></span>
                </div>
                
                <!-- URL Display for Manual Access -->
                <p class="mt-8 text-[10px] text-gray-600 bg-black/20 px-4 py-2 rounded-lg cursor-pointer hover:text-yoga-400 break-all" @click="copyLink()" x-text="checkinUrl"></p>
            </div>
        </section>

        <!-- Right: Realtime Attendance -->
        <section x-show="selectedClassId" class="space-y-6" x-transition>
            <div class="glass p-8 rounded-[2.5rem] h-full flex flex-col">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-2xl font-display font-bold">Kehadiran Peserta</h2>
                        <p class="text-gray-400 text-sm mt-1">Status kehadiran langsung (Refresh 5s)</p>
                    </div>
                    <div class="text-right">
                        <span class="text-4xl font-bold text-yoga-400" x-text="attendance.total_present">0</span>
                        <span class="text-gray-600 font-bold">/</span>
                        <span class="text-xl text-gray-500 font-bold" x-text="selectedClassQuota">0</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-dark-900 h-3 rounded-full overflow-hidden mb-8 border border-gray-800">
                    <div class="h-full yoga-gradient transition-all duration-1000" :style="`width: ${(attendance.total_present/selectedClassQuota)*100}%`"></div>
                </div>

                <!-- Attendance List -->
                <div class="flex-1 overflow-y-auto space-y-3 max-h-[500px] pr-2 custom-scrollbar">
                    <template x-for="person in attendance.list" :key="person.id">
                        <div class="bg-dark-900/50 p-4 rounded-2xl flex justify-between items-center border border-gray-800 animate-slide-in">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-yoga-500/10 rounded-full flex items-center justify-center text-yoga-500 font-bold" x-text="person.name[0]"></div>
                                <div>
                                    <p class="font-bold text-sm" x-text="person.name"></p>
                                    <p class="text-[10px] text-gray-500" x-text="formatTime(person.checkin_at)"></p>
                                </div>
                            </div>
                            <span class="text-[10px] font-bold text-green-500 bg-green-500/10 px-2 py-1 rounded-md border border-green-500/20">Checked In</span>
                        </div>
                    </template>
                    <div x-show="attendance.list.length === 0" class="text-center py-20 text-gray-600">
                        <p class="text-4xl mb-4">🧘‍♂️</p>
                        <p class="text-sm italic">Belum ada peserta yang hadir...</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        function adminCheckin() {
            return {
                apiUrl: "https://script.google.com/macros/s/AKfycbxn9nx9olYW6_KzJM47FDrLUc8BpR1cFCMA7oxe_1GytrLvxs7vOTp-xS6RayZoq9KbBQ/exec",
                classes: [],
                selectedClassId: '',
                selectedClassTitle: '',
                selectedClassQuota: 0,
                token: '',
                checkinUrl: '',
                loading: false,
                attendance: { total_present: 0, list: [] },
                syncInterval: null,

                async init() {
                    await this.loadClasses();
                },

                async loadClasses() {
                    const res = await fetch(`${this.apiUrl}?action=classes`).then(r => r.json());
                    if (res.success) {
                        this.classes = res.data;
                    }
                },

                async generateToken() {
                    if (!this.selectedClassId) return;
                    this.loading = true;
                    this.token = ''; // Reset token
                    
                    try {
                        const res = await fetch(`${this.apiUrl}?action=generate_token&class_id=${this.selectedClassId}`).then(r => r.json());
                        
                        if (res.success) {
                            this.token = res.data.token;
                            
                            // Base URL for GitHub Pages or current host
                            const baseUrl = window.location.origin + window.location.pathname.replace('admin-checkin.html', 'checkin.html');
                            this.checkinUrl = `${baseUrl}?token=${this.token}`;
                            
                            // Clear and Generate QR
                            this.$nextTick(() => {
                                const container = document.getElementById("qrcode-container");
                                container.innerHTML = "";
                                new QRCode(container, {
                                    text: this.checkinUrl,
                                    width: 250,
                                    height: 250,
                                    colorDark: "#0f172a",
                                    correctLevel: QRCode.CorrectLevel.H
                                });
                            });

                            const cls = this.classes.find(c => c.id == this.selectedClassId);
                            this.selectedClassTitle = cls.title;
                            this.selectedClassQuota = cls.quota;

                            this.startAttendanceSync();
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Gagal Generate QR',
                                text: res.message || 'Terjadi kesalahan pada server.',
                                background: '#1e293b', color: '#fff'
                            });
                        }
                    } catch (err) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Network Error',
                            text: 'Gagal menghubungi server Apps Script. Pastikan Anda sudah "Deploy" sebagai "Web App" dan izin akses diatur ke "Anyone".',
                            background: '#1e293b', color: '#fff'
                        });
                    } finally { this.loading = false; }
                },

                async startAttendanceSync() {
                    this.stopAttendanceSync();
                    await this.fetchAttendance();
                    this.syncInterval = setInterval(() => this.fetchAttendance(), 5000);
                },

                stopAttendanceSync() {
                    if (this.syncInterval) clearInterval(this.syncInterval);
                    this.attendance = { total_present: 0, list: [] };
                },

                async fetchAttendance() {
                    if (!this.selectedClassId) return;
                    const res = await fetch(`${this.apiUrl}?action=attendance_list&class_id=${this.selectedClassId}`).then(r => r.json());
                    if (res.success) {
                        this.attendance = res.data;
                    }
                },

                copyLink() {
                    navigator.clipboard.writeText(this.checkinUrl);
                    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Link copied!', showConfirmButton: false, timer: 1500 });
                },

                formatTime(iso) {
                    return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                }
            }
        }
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .animate-slide-in { animation: slideIn 0.5s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</body>
</html>
