<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | Schedule Management</title>

    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta property="og:image" content="logo.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/api.js"></script>
    
        <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: {
                            50: '#FDFBFD',
                            100: '#F9F3F9',
                            200: '#F4E7F4',
                            300: '#E9D1EA',
                            400: '#DFBBDF',
                            500: '#D8B4E2',
                            600: '#C08BCF',
                            700: '#A765B9',
                            800: '#7B6291',
                            900: '#2D3142'
                        },
                        dark: {
                            900: '#121016',
                            800: '#1a1822',
                            700: '#252230'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.06)',
                        'glow': '0 10px 20px -5px rgba(216, 180, 226, 0.4)'
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #FDFBFD; color: #2D3142; }
        .glass { background: #FFFFFF; border: none; box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05); }
        .dark .glass { background: rgba(30, 28, 38, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5); }
        .yoga-gradient { background: linear-gradient(135deg, #FFB6C1 0%, #D8B4E2 100%); color: white; }
    </style>
</head>
<body class="bg-yoga-50 dark:bg-dark-900 text-yoga-900 dark:text-gray-100 font-sans min-h-screen transition-colors duration-500" x-data="scheduleApp()">

    <div class="flex min-h-screen">
        
        <!-- Sidebar Navigation (Same as before) -->
        <aside :class="sidebarOpen ? 'lg:w-72' : 'lg:w-20'" class="glass border-r border-white/5 hidden lg:flex fixed lg:static inset-y-0 left-0 z-50 transition-all duration-300 flex-col overflow-hidden">
            <div class="p-6 flex items-center gap-3 border-b border-white/5">
                <div class="w-10 h-10 yoga-gradient rounded-xl flex-shrink-0 flex items-center justify-center font-bold text-xl shadow-lg">N</div>
                <div x-show="sidebarOpen" x-transition class="overflow-hidden whitespace-nowrap">
                    <h2 class="font-display font-bold text-lg leading-none">Natha Admin</h2>
                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Management</span>
                </div>
            </div>

            <div class="flex-1 py-6 space-y-2 overflow-y-auto custom-scrollbar px-3">
                <a href="admin.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">📊</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Dashboard</span>
                </a>
                <a href="admin-classes.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">🧘</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Classes</span>
                </a>
                <a href="admin-schedules.html" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-yoga-500/10 text-yoga-400 border border-yoga-500/20 group transition-all">
                    <span class="text-xl">📅</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Schedules</span>
                </a>
                <a href="admin-membership.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">💎</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Membership</span>
                </a>
                <a href="admin-promo.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">🏷️</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Promo</span>
                </a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
            <!-- Header -->
            <header class="glass h-20 border-b border-white/5 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="hidden lg:block p-2 hover:bg-white/5 rounded-lg transition-all">
                        <span class="text-xl" x-text="sidebarOpen ? '◀' : '▶'"></span>
                    </button>
                    <a href="admin-checkin.html" class="lg:hidden w-10 h-10 glass rounded-full flex items-center justify-center text-sm hover:scale-105 transition-all">✅</a>
                    <h1 class="text-xl font-display font-bold">Class Schedules</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="toggleTheme()" class="w-10 h-10 glass rounded-full flex items-center justify-center hover:scale-110 transition-all mr-2">
                        <span class="text-lg" x-text="isDark ? '☀️' : '🌙'"></span>
                    </button>
                    <button @click="openModal()" class="bg-yoga-500 px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-yoga-500/20">+ Create Schedule</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto custom-scrollbar p-8 pb-32 lg:pb-8">
                <!-- Loading State -->
                <div x-show="loading && schedules.length === 0" class="flex flex-col items-center justify-center py-20">
                    <div class="spinner mb-4"></div>
                    <p class="text-gray-500 font-bold uppercase tracking-widest text-[10px]">Loading Schedules...</p>
                </div>

                <!-- Filters & Search -->
                <div class="flex flex-col md:flex-row gap-4 justify-between mb-6" x-show="!loading && schedules.length > 0" x-cloak>
                    <div class="flex-1 w-full relative">
                        <input type="text" x-model="searchQuery" @input="currentPage = 1" placeholder="Search class, instructor, room..." class="w-full bg-white dark:bg-white/5 border border-gray-100 dark:border-white/10 rounded-2xl px-6 py-3 pl-12 outline-none focus:ring-2 focus:ring-yoga-500 transition-all text-yoga-900 dark:text-white shadow-soft">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                    </div>
                    <div class="w-full md:w-48">
                        <select x-model="filterInstructor" @change="currentPage = 1" class="w-full bg-white dark:bg-white/5 border border-gray-100 dark:border-white/10 rounded-2xl px-6 py-3 outline-none focus:ring-2 focus:ring-yoga-500 transition-all text-yoga-900 dark:text-white shadow-soft">
                            <option value="">All Instructors</option>
                            <template x-for="inst in uniqueInstructors" :key="inst">
                                <option :value="inst" x-text="inst"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Schedule List -->
                <div x-show="!loading || schedules.length > 0">
                    
                    <!-- Desktop Table View -->
                    <div class="hidden md:block glass rounded-[3rem] overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50/50 dark:bg-white/5 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                                        <th class="px-8 py-6">Date & Class</th>
                                        <th class="px-8 py-6">Time (WITA)</th>
                                        <th class="px-8 py-6">Instructor</th>
                                        <th class="px-8 py-6">Room</th>
                                        <th class="px-8 py-6 text-center">Slot</th>
                                        <th class="px-8 py-6 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-white/5">
                                <template x-if="filteredSchedules.length === 0 && !loading">
                                        <tr>
                                            <td colspan="6" class="px-8 py-20 text-center">
                                                <div class="flex flex-col items-center gap-3 opacity-50">
                                                    <span class="text-4xl">📅</span>
                                                    <p class="text-xs font-bold uppercase tracking-widest">No schedules found</p>
                                                    <button @click="openModal()" class="text-yoga-500 dark:text-yoga-400 text-[10px] underline">Create your first schedule</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-for="s in paginatedSchedules" :key="s.id">
                                        <tr class="hover:bg-gray-50 dark:hover:bg-white/5 transition-all">
                                            <td class="px-8 py-6">
                                                <p class="font-bold text-yoga-900 dark:text-white" x-text="formatDate(s.date)"></p>
                                                <p class="text-xs text-yoga-500 dark:text-yoga-400 font-bold uppercase mt-1 flex items-center gap-2">
                                                    <span x-text="s.class_title"></span>
                                                    <span x-show="isClassPast(s)" class="bg-red-500/10 text-red-500 border border-red-500/20 px-2 py-0.5 rounded-full text-[9px] uppercase tracking-wider font-bold">Kedaluwarsa</span>
                                                </p>
                                            </td>
                                            <td class="px-8 py-6 font-mono text-xs text-gray-500" x-text="s.formatted_time"></td>
                                            <td class="px-8 py-6">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-8 h-8 rounded-full bg-yoga-50 dark:bg-white/10 flex items-center justify-center text-xs">🧘</div>
                                                    <span class="text-sm font-bold text-yoga-900 dark:text-white" x-text="s.instructor"></span>
                                                </div>
                                            </td>
                                            <td class="px-8 py-6 text-sm text-gray-400" x-text="s.room"></td>
                                            <td class="px-8 py-6 text-center">
                                                <button @click="showParticipants(s)" class="bg-yoga-50 dark:bg-yoga-500/10 hover:bg-yoga-100 dark:hover:bg-yoga-500/25 border border-yoga-100 dark:border-yoga-500/20 px-3 py-1 rounded-full text-xs font-bold text-yoga-600 dark:text-yoga-400 transition-all cursor-pointer flex items-center gap-1.5 mx-auto">
                                                    <span>👥</span>
                                                    <span x-text="`${s.booked}/${s.quota}`"></span>
                                                </button>
                                            </td>
                                            <td class="px-8 py-6 text-right space-x-2">
                                                <button @click="openCheckin(s)" title="Generate QR Check-in" class="text-green-500 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-400/10 p-2 rounded-lg transition-all">📷</button>
                                                <button @click="openModal(s)" class="text-blue-500 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-400/10 p-2 rounded-lg transition-all">✏️</button>
                                                <button @click="confirmDelete(s.id)" class="text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-400/10 p-2 rounded-lg transition-all">🗑️</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Mobile Card View -->
                    <div class="md:hidden space-y-4 pb-4">
                        <template x-if="filteredSchedules.length === 0 && !loading">
                            <div class="py-20 text-center glass rounded-[2rem]">
                                <div class="flex flex-col items-center gap-3 opacity-50">
                                    <span class="text-4xl">📅</span>
                                    <p class="text-xs font-bold uppercase tracking-widest">No schedules found</p>
                                    <button @click="openModal()" class="text-yoga-500 text-[10px] underline">Create your first schedule</button>
                                </div>
                            </div>
                        </template>
                        <template x-for="s in paginatedSchedules" :key="s.id">
                            <div class="glass p-6 rounded-[2rem] shadow-soft bg-white dark:bg-dark-800 flex flex-col gap-4 border border-gray-50 dark:border-white/5">
                                <div class="flex justify-between items-start border-b border-gray-100 dark:border-white/5 pb-4">
                                    <div>
                                        <p class="font-bold text-yoga-900 dark:text-white" x-text="formatDate(s.date)"></p>
                                        <p class="text-xs text-yoga-500 font-bold uppercase mt-1 flex items-center gap-2">
                                            <span x-text="s.class_title"></span>
                                            <span x-show="isClassPast(s)" class="bg-red-500/10 text-red-500 border border-red-500/20 px-2 py-0.5 rounded-full text-[9px] uppercase tracking-wider font-bold">Kedaluwarsa</span>
                                        </p>
                                        <p class="font-mono text-[11px] text-gray-500 mt-2" x-text="s.formatted_time"></p>
                                    </div>
                                    <button @click="showParticipants(s)" class="bg-yoga-50 dark:bg-yoga-500/10 px-3 py-1.5 rounded-full text-[10px] font-bold text-yoga-600 dark:text-yoga-400 flex items-center gap-1.5 shadow-sm border border-yoga-100 dark:border-yoga-500/20">
                                        <span>👥</span> <span x-text="`${s.booked}/${s.quota}`"></span>
                                    </button>
                                </div>
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-yoga-50 dark:bg-white/10 flex items-center justify-center text-sm">🧘</div>
                                        <div>
                                            <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Instructor</p>
                                            <p class="text-xs font-bold text-yoga-900 dark:text-white leading-tight mt-0.5" x-text="s.instructor"></p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Room</p>
                                        <p class="text-xs font-bold text-yoga-900 dark:text-white leading-tight mt-0.5" x-text="s.room"></p>
                                    </div>
                                </div>
                                <div class="pt-4 mt-2 border-t border-gray-100 dark:border-white/5 flex gap-2 justify-end">
                                    <button @click="openCheckin(s)" class="text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-400/10 px-4 py-2 rounded-xl text-[10px] uppercase tracking-widest font-bold flex items-center gap-1"><span>📷</span> QR</button>
                                    <button @click="openModal(s)" class="text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-400/10 px-4 py-2 rounded-xl text-[10px] uppercase tracking-widest font-bold">Edit</button>
                                    <button @click="confirmDelete(s.id)" class="text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-400/10 px-4 py-2 rounded-xl text-[10px] uppercase tracking-widest font-bold">Delete</button>
                                </div>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Load More Button -->
                    <div class="text-center mt-6 pb-10" x-show="hasMore" x-cloak>
                        <button @click="currentPage++" class="glass px-8 py-3 rounded-full text-xs font-bold text-yoga-500 hover:scale-105 transition-all shadow-soft border border-gray-50 dark:border-white/5">
                            Load More Schedules ↓
                        </button>
                    </div>
                </div>
            </main>

                        <!-- Mobile Bottom Navigation (Mobile Only) -->
            <div class="fixed bottom-0 inset-x-0 z-40 px-6 pb-6 lg:hidden pointer-events-none">
                <div class="max-w-md mx-auto h-[4.5rem] bg-white dark:bg-dark-800 rounded-full flex items-center justify-around px-4 pointer-events-auto shadow-soft border border-gray-50 dark:border-dark-700">
                    <a href="admin.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500" data-id="admin.html">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors yoga-gradient shadow-glow text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        </div>
                        <span class="text-[9px] font-bold">Dash</span>
                    </a>
                    <a href="admin-classes.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500" data-id="admin-classes.html">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors ">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <span class="text-[9px] font-bold">Classes</span>
                    </a>
                    <a href="admin-schedules.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-yoga-500 -translate-y-2" data-id="admin-schedules.html">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors ">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="text-[9px] font-bold">Jadwal</span>
                    </a>
                    <a href="admin-membership.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500" data-id="admin-membership.html">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors ">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        </div>
                        <span class="text-[9px] font-bold">Member</span>
                    </a>
                    <button @click="mobileMenuOpen = !mobileMenuOpen" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </div>
                        <span class="text-[9px] font-bold">Menu</span>
                    </button>
                </div>
            </div>

            <!-- Mobile Drawer Menu Overlay -->
            <div x-show="mobileMenuOpen" x-cloak 
                 @click="mobileMenuOpen = false"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="fixed inset-0 z-50 bg-black/20 backdrop-blur-md dark:bg-black/60 backdrop-blur-sm lg:hidden pointer-events-auto">
                
                <!-- Drawer Container -->
                <div @click.stop
                     x-transition:enter="transition ease-out duration-300 transform"
                     x-transition:enter-start="translate-y-full"
                     x-transition:enter-end="translate-y-0"
                     x-transition:leave="transition ease-in duration-200 transform"
                     x-transition:leave-start="translate-y-0"
                     x-transition:leave-end="translate-y-full"
                     class="absolute bottom-0 inset-x-0 glass rounded-t-[3rem] p-8 space-y-6 max-h-[85vh] overflow-y-auto pointer-events-auto">
                    
                    <div class="flex justify-between items-center pb-4 border-b border-gray-200 dark:border-white/5">
                        <h3 class="font-display font-bold text-lg text-gray-900 dark:text-white">Natha Admin Menu</h3>
                        <button @click="mobileMenuOpen = false" class="w-8 h-8 rounded-full bg-white shadow-sm dark:bg-white/5 dark:shadow-none flex items-center justify-center text-sm font-bold">✕</button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <a href="admin-promo.html" class="flex flex-col items-center justify-center p-5 rounded-2xl bg-white shadow-sm dark:bg-white/5 dark:shadow-none hover:bg-gray-50 dark:hover:bg-white/10 transition-all border border-gray-200 dark:border-white/5 text-center">
                            <span class="text-2xl mb-2">🏷️</span>
                            <span class="text-xs font-bold text-gray-900 dark:text-white">Promos & Vouchers</span>
                        </a>
                        <a href="scanner.html" class="flex flex-col items-center justify-center p-5 rounded-2xl bg-white shadow-sm dark:bg-white/5 dark:shadow-none hover:bg-gray-50 dark:hover:bg-white/10 transition-all border border-gray-200 dark:border-white/5 text-center">
                            <span class="text-2xl mb-2">🔍</span>
                            <span class="text-xs font-bold text-gray-900 dark:text-white">QR Scanner</span>
                        </a>
                        <a href="admin-checkin.html" class="flex flex-col items-center justify-center p-5 rounded-2xl bg-white shadow-sm dark:bg-white/5 dark:shadow-none hover:bg-gray-50 dark:hover:bg-white/10 transition-all border border-gray-200 dark:border-white/5 text-center">
                            <span class="text-2xl mb-2">✅</span>
                            <span class="text-xs font-bold text-gray-900 dark:text-white">Check-in Page</span>
                        </a>
                        <button @click="toggleTheme(); mobileMenuOpen = false" class="flex flex-col items-center justify-center p-5 rounded-2xl bg-white shadow-sm dark:bg-white/5 dark:shadow-none hover:bg-gray-50 dark:hover:bg-white/10 transition-all border border-gray-200 dark:border-white/5 text-center">
                            <span class="text-2xl mb-2" x-text="isDark ? '☀️' : '🌙'">🌙</span>
                            <span class="text-xs font-bold text-gray-900 dark:text-white" x-text="isDark ? 'Light Mode' : 'Dark Mode'">Dark Mode</span>
                        </button>
                    </div>

                    <div class="pt-4 border-t border-gray-200 dark:border-white/5">
                        <button @click="logout()" class="w-full py-4 rounded-2xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-sm transition-all flex items-center justify-center gap-3">
                            <span>🚪</span>
                            <span>Sign Out / Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Create Schedule -->
    <div x-show="modalOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-dark-950/80 backdrop-blur-sm" x-cloak>
        <div class="glass w-full max-w-3xl rounded-[3rem] p-10 overflow-hidden relative shadow-2xl" x-transition>
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-display font-bold">Create Schedule</h2>
                <button @click="modalOpen = false" class="p-2 hover:bg-white/5 rounded-lg">✕</button>
            </div>
            
            <form @submit.prevent="saveSchedule" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Class Master</label>
                        <select x-model="formData.class_id" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all" required>
                            <option value="">Select Class</option>
                            <template x-for="c in classes" :key="c.id">
                                <option :value="c.id" x-text="c.title"></option>
                            </template>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Instructor</label>
                        <input type="text" x-model="formData.instructor" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all" required placeholder="E.g. Santi Devi">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Date</label>
                        <input type="text" id="date-picker" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Start Time</label>
                        <input type="text" id="start-time" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">End Time</label>
                        <input type="text" id="end-time" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all" required>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Room</label>
                        <select x-model="formData.room" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                            <option value="Main Room">Main Room</option>
                            <option value="Studio B">Studio B</option>
                            <option value="Private Deck">Private Deck</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Quota</label>
                        <input type="number" x-model="formData.quota" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Recurring</label>
                        <select x-model="formData.recurring_type" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                            <option value="one_time">One Time</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2" x-show="formData.recurring_type !== 'one_time'">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Recurring Until</label>
                    <input type="text" id="until-date" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="button" @click="modalOpen = false" class="flex-1 py-4 rounded-2xl text-gray-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button type="submit" :disabled="loading" class="flex-[2] yoga-gradient py-4 rounded-2xl font-bold text-white shadow-xl shadow-yoga-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span x-show="loading" class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
                        <span x-text="loading ? 'Validating...' : 'Create Schedule'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function scheduleApp() {
            return {
                sidebarOpen: window.innerWidth > 1024,
                schedules: [],
                searchQuery: '',
                filterInstructor: '',
                currentPage: 1,
                itemsPerPage: 10,
                classes: [],
                loading: true,
                modalOpen: false,
                formData: {
                    class_id: '', instructor: '', date: '', start_time: '', 
                    end_time: '', room: 'Main Room', quota: 20, 
                    recurring_type: 'one_time', recurring_until: '', timezone: 'WITA'
                },

                get filteredSchedules() {
                    let filtered = this.schedules;
                    if (this.searchQuery) {
                        const q = this.searchQuery.toLowerCase();
                        filtered = filtered.filter(s => 
                            (s.class_title && s.class_title.toLowerCase().includes(q)) || 
                            (s.instructor && s.instructor.toLowerCase().includes(q)) ||
                            (s.room && s.room.toLowerCase().includes(q))
                        );
                    }
                    if (this.filterInstructor) {
                        filtered = filtered.filter(s => s.instructor === this.filterInstructor);
                    }
                    return filtered;
                },
                
                get paginatedSchedules() {
                    return this.filteredSchedules.slice(0, this.currentPage * this.itemsPerPage);
                },
                
                get hasMore() {
                    return this.paginatedSchedules.length < this.filteredSchedules.length;
                },
                
                get uniqueInstructors() {
                    return [...new Set(this.schedules.map(s => s.instructor).filter(Boolean))];
                },

                isDark: false,
                mobileMenuOpen: false,

                initTheme() {
                    this.isDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                toggleTheme() {
                    this.isDark = !this.isDark;
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                        localStorage.theme = 'dark';
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.theme = 'light';
                    }
                },

                async init() {
                    this.initTheme();
                    this.loading = true;
                    this.initPickers();
                    await Promise.all([this.fetchSchedules(), this.fetchClasses()]);
                    this.loading = false;
                },

                initPickers() {
                    this.pickers = {};
                    this.pickers.date = flatpickr("#date-picker", { 
                        dateFormat: "Y-m-d", 
                        onChange: (dates, str) => this.formData.date = str 
                    });
                    this.pickers.until = flatpickr("#until-date", { 
                        dateFormat: "Y-m-d", 
                        onChange: (dates, str) => this.formData.recurring_until = str 
                    });
                    this.pickers.start = flatpickr("#start-time", { 
                        enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true,
                        onChange: (dates, str) => this.formData.start_time = str
                    });
                    this.pickers.end = flatpickr("#end-time", { 
                        enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true,
                        onChange: (dates, str) => this.formData.end_time = str
                    });
                },

                async fetchSchedules() {
                    try {
                        const res = await fetch(`${API.URL}?action=admin_schedules`).then(r => r.json());
                        if (res.success) this.schedules = res.data;
                    } catch (e) { console.error("Fetch Schedules Error:", e); }
                },

                async fetchClasses() {
                    try {
                        const res = await fetch(`${API.URL}?action=admin_classes`).then(r => r.json());
                        if (res.success) this.classes = res.data;
                    } catch (e) { console.error("Fetch Classes Error:", e); }
                },

                openCheckin(s) {
                    window.location.href = `admin-checkin.html?class_id=${s.id}`;
                },

                openModal(schedule = null) {
                    if (schedule) {
                        this.editingId = schedule.id;
                        this.formData = { ...schedule };
                        // Ensure numeric types
                        this.formData.quota = Number(this.formData.quota);
                        
                        // Sync Pickers
                        this.$nextTick(() => {
                            if (this.formData.date) this.pickers.date.setDate(this.formData.date);
                            if (this.formData.start_time) this.pickers.start.setDate(this.formData.start_time);
                            if (this.formData.end_time) this.pickers.end.setDate(this.formData.end_time);
                            if (this.formData.recurring_until) this.pickers.until.setDate(this.formData.recurring_until);
                        });
                    } else {
                        this.editingId = null;
                        this.formData = { 
                            class_id: '', instructor: '', date: '', start_time: '', 
                            end_time: '', room: 'Main Room', quota: 20, 
                            recurring_type: 'one_time', recurring_until: '', timezone: 'WITA'
                        };
                        this.pickers.date.clear();
                        this.pickers.start.clear();
                        this.pickers.end.clear();
                        this.pickers.until.clear();
                    }
                    this.modalOpen = true;
                },

                async saveSchedule() {
                    if (!this.formData.date || !this.formData.start_time || !this.formData.end_time) {
                        return Swal.fire('Error', 'Mohon isi Tanggal dan Jam dengan benar', 'error');
                    }

                    this.loading = true;
                    try {
                        // 1. Validate Conflict First
                        const conflictUrl = `${API.URL}?action=validate_conflict&date=${this.formData.date}&start_time=${this.formData.start_time}&end_time=${this.formData.end_time}&instructor=${encodeURIComponent(this.formData.instructor)}&room=${encodeURIComponent(this.formData.room)}`;
                        const conflictRes = await fetch(conflictUrl).then(r => r.json());
                        
                        if (conflictRes.isConflict) {
                            Swal.fire({ icon: 'error', title: 'Schedule Conflict!', text: conflictRes.message, background: '#1e293b', color: '#fff' });
                            this.loading = false;
                            return;
                        }

                        // 2. Save
                        const res = await fetch(API.URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ 
                                action: this.editingId ? 'update_schedule' : 'create_schedule', 
                                id: this.editingId,
                                ...this.formData 
                            })
                        }).then(r => r.json());

                        if (res.success) {
                            Swal.fire({ icon: 'success', title: 'Schedule Created!', text: res.count > 1 ? `${res.count} instances created.` : 'Jadwal berhasil dibuat.', background: '#1e293b', color: '#fff', timer: 2000 });
                            this.modalOpen = false;
                            await this.fetchSchedules();
                        } else {
                            Swal.fire({ icon: 'error', title: 'Oops!', text: res.message || 'Gagal menyimpan data ke Google Sheets.', background: '#1e293b', color: '#fff' });
                        }
                    } catch (error) {
                        console.error("Save Error:", error);
                        Swal.fire({ icon: 'error', title: 'Connection Error', text: 'Gagal menghubungi server. Pastikan API URL sudah benar dan Backend sudah di-deploy sebagai "Anyone".', background: '#1e293b', color: '#fff' });
                    } finally { 
                        this.loading = false; 
                    }
                },

                async confirmDelete(id) {
                    const { isConfirmed } = await Swal.fire({
                        title: 'Delete Schedule?',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#ef4444',
                        background: '#1e293b',
                        color: '#fff'
                    });

                    if (isConfirmed) {
                        const res = await fetch(API.URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'delete_schedule', id })
                        }).then(r => r.json());

                        if (res.success) {
                            Swal.fire({ icon: 'success', title: 'Deleted!', showConfirmButton: false, timer: 1500 });
                            this.fetchSchedules();
                        } else {
                            Swal.fire({ icon: 'error', title: 'Gagal Menghapus', text: res.message, background: '#1e293b', color: '#fff' });
                        }
                    }
                },

                formatDate(iso) { return new Date(iso).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); },

                async showParticipants(schedule) {
                    Swal.fire({
                        title: 'Memuat Peserta...',
                        text: 'Silakan tunggu sebentar...',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        },
                        background: '#1e293b',
                        color: '#fff'
                    });

                    try {
                        const res = await fetch(`${API.URL}?action=admin_bookings`).then(r => r.json());
                        if (res.success) {
                            const participants = res.data.filter(b => b.schedule_id == schedule.id);

                            if (participants.length === 0) {
                                Swal.fire({
                                    icon: 'info',
                                    title: 'Sesi Masih Kosong',
                                    text: 'Belum ada peserta yang mendaftar di sesi kelas ini.',
                                    background: '#1e293b',
                                    color: '#fff',
                                    confirmButtonColor: '#8b5cf6'
                                });
                                return;
                            }

                            let html = `
                                <div class="text-left mt-4 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 space-y-3">
                            `;

                            participants.forEach(p => {
                                const isPaid = p.payment_status === 'paid';
                                const paymentBadge = isPaid 
                                    ? '<span class="bg-green-500/10 text-green-400 border border-green-500/20 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Paid</span>'
                                    : '<span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Pending</span>';
                                
                                let statusBadge = '';
                                if (p.status === 'checked_in') {
                                    statusBadge = '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Hadir</span>';
                                } else if (p.status === 'cancelled') {
                                    statusBadge = '<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Batal</span>';
                                } else {
                                    statusBadge = '<span class="bg-gray-500/10 text-gray-400 border border-gray-500/20 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Confirmed</span>';
                                }

                                html += `
                                    <div class="bg-slate-900/60 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                                        <div class="space-y-1">
                                            <p class="font-bold text-sm text-white">${p.name}</p>
                                            <p class="text-xs text-gray-400 flex items-center gap-1">
                                                <span>📞</span> ${p.phone}
                                            </p>
                                        </div>
                                        <div class="flex flex-col items-end gap-1.5">
                                            ${paymentBadge}
                                            ${statusBadge}
                                        </div>
                                    </div>
                                `;
                            });

                            html += `</div>`;

                            Swal.fire({
                                title: schedule.class_title,
                                html: `
                                    <div class="text-center text-xs text-gray-400 mb-4 pb-4 border-b border-white/5">
                                        <p class="font-semibold text-yoga-400">${this.formatDate(schedule.date)}</p>
                                        <p class="mt-1">${schedule.formatted_time} • ${schedule.instructor} • ${schedule.room}</p>
                                    </div>
                                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest text-left">Daftar Peserta (${participants.length})</p>
                                    ${html}
                                `,
                                background: '#1e293b',
                                color: '#fff',
                                confirmButtonColor: '#8b5cf6',
                                confirmButtonText: 'Tutup',
                                customClass: {
                                    popup: 'rounded-[2rem]'
                                }
                            });
                        } else {
                            Swal.fire({ icon: 'error', title: 'Gagal Memuat', text: res.message || 'Terjadi kesalahan.', background: '#1e293b', color: '#fff' });
                        }
                    } catch (e) {
                        console.error(e);
                        Swal.fire({ icon: 'error', title: 'Koneksi Gagal', text: 'Tidak dapat menghubungi server API.', background: '#1e293b', color: '#fff' });
                    }
                },

                // Format Date
                formatDate(dateString) {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
                },

                // HELPER: Cek Kadaluwarsa
                isClassPast(sch) {
                    if (!sch.date) return false;
                    try {
                        const schDate = new Date(sch.date);
                        if (isNaN(schDate.getTime())) return false;
                        if (sch.end_time) {
                            const timeStr = sch.end_time.toString();
                            if (timeStr.includes('T')) {
                                const parsedTime = new Date(timeStr);
                                if (!isNaN(parsedTime)) schDate.setHours(parsedTime.getHours(), parsedTime.getMinutes(), 0, 0);
                            } else {
                                const timeParts = timeStr.split(':');
                                if (timeParts.length >= 2) schDate.setHours(parseInt(timeParts[0], 10), parseInt(timeParts[1], 10), 0, 0);
                            }
                        } else {
                            schDate.setHours(23, 59, 59, 999);
                        }
                        return schDate < new Date();
                    } catch (e) { return false; }
                }
            }
        }
    </script>
</body>
