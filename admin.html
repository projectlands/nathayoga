<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | Admin Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: { 500: '#8b5cf6', 600: '#7c3aed', 400: '#a78bfa' },
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .yoga-gradient { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Custom SweetAlert2 select input styling to prevent invisible text */
        .swal2-select {
            color: #ffffff !important;
            background-color: #1e293b !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 0.75rem !important;
            padding: 0.75rem 1rem !important;
        }
        .swal2-select option {
            color: #ffffff !important;
            background-color: #1e293b !important;
        }
    </style>
</head>
<body class="font-sans min-h-screen bg-dark-900 text-white" x-data="adminApp()">

    <!-- Admin Layout Wrapper -->
    <div class="flex min-h-screen">
        
        <!-- Sidebar Navigation -->
        <aside :class="sidebarOpen ? 'w-72' : 'w-20'" class="glass border-r border-white/5 fixed lg:static inset-y-0 left-0 z-50 transition-all duration-300 flex flex-col overflow-hidden">
            <!-- Sidebar Header -->
            <div class="p-6 flex items-center gap-3 border-b border-white/5">
                <div class="w-10 h-10 yoga-gradient rounded-xl flex-shrink-0 flex items-center justify-center font-bold text-xl shadow-lg">N</div>
                <div x-show="sidebarOpen" x-transition class="overflow-hidden whitespace-nowrap">
                    <h2 class="font-display font-bold text-lg leading-none">Natha Admin</h2>
                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Management v1.5</span>
                </div>
            </div>

            <!-- Sidebar Menu -->
            <div class="flex-1 py-6 space-y-2 overflow-y-auto custom-scrollbar px-3">
                <a href="admin.html" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-yoga-500/10 text-yoga-400 border border-yoga-500/20 group transition-all">
                    <span class="text-xl">📊</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Dashboard</span>
                </a>
                <a href="admin-classes.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">🧘</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Classes</span>
                </a>
                <a href="admin-schedules.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">📅</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Schedules</span>
                </a>
                <a href="admin-membership.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">💎</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Membership</span>
                </a>
                <a href="admin-promo.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">🏷️</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Promo & Voucher</span>
                </a>
                <a href="scanner.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">🔍</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">QR Scanner</span>
                </a>
                <a href="admin-checkin.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all group">
                    <span class="text-xl">✅</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Check-in Page</span>
                </a>
            </div>

            <!-- Sidebar Footer -->
            <div class="p-6 border-t border-white/5">
                <button @click="logout()" class="flex items-center gap-4 px-4 py-3 rounded-xl w-full text-red-400 hover:bg-red-400/10 transition-all">
                    <span class="text-xl">🚪</span>
                    <span x-show="sidebarOpen" class="text-sm font-bold">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
            
            <!-- Top Header -->
            <header class="glass h-20 border-b border-white/5 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="p-2 hover:bg-white/5 rounded-lg transition-all">
                        <span class="text-xl" x-text="sidebarOpen ? '◀' : '▶'"></span>
                    </button>
                    <h1 class="text-xl font-display font-bold">Dashboard Overview</h1>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right hidden sm:block">
                        <p class="text-xs font-bold" x-text="lastRefresh">12:00:00</p>
                        <p class="text-[10px] text-gray-500 uppercase">Last Sync</p>
                    </div>
                    <button @click="fetchData()" class="w-10 h-10 glass rounded-full flex items-center justify-center hover:scale-110 transition-all">🔄</button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto custom-scrollbar p-8 space-y-8">
                
                <!-- Stats Grid -->
                <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="glass p-8 rounded-[2.5rem] relative overflow-hidden group">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-yoga-500/10 blur-3xl group-hover:bg-yoga-500/20 transition-all"></div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-2">Total Bookings</p>
                        <h3 class="text-4xl font-display font-bold" x-text="stats.total_bookings">0</h3>
                    </div>
                    <div class="glass p-8 rounded-[2.5rem] relative overflow-hidden group">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/10 blur-3xl group-hover:bg-green-500/20 transition-all"></div>
                        <p class="text-[10px] font-bold text-green-500 uppercase tracking-[0.2em] mb-2">Revenue Estimated</p>
                        <h3 class="text-4xl font-display font-bold" x-text="formatCurrency(stats.revenue_est)">Rp 0</h3>
                    </div>
                    <div class="glass p-8 rounded-[2.5rem] relative overflow-hidden group">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500/10 blur-3xl group-hover:bg-yellow-500/20 transition-all"></div>
                        <p class="text-[10px] font-bold text-yellow-500 uppercase tracking-[0.2em] mb-2">Pending Payment</p>
                        <h3 class="text-4xl font-display font-bold" x-text="stats.total_pending">0</h3>
                        <p class="text-xs text-gray-400 mt-2" x-show="stats.revenue_pending > 0" x-text="'Est. ' + formatCurrency(stats.revenue_pending)"></p>
                    </div>
                    <div class="glass p-8 rounded-[2.5rem] relative overflow-hidden group">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-yoga-400/10 blur-3xl group-hover:bg-yoga-400/20 transition-all"></div>
                        <p class="text-[10px] font-bold text-yoga-400 uppercase tracking-[0.2em] mb-2">Attendance Today</p>
                        <h3 class="text-4xl font-display font-bold" x-text="stats.attendance_today">0</h3>
                    </div>
                </section>

                <!-- Filter & Table -->
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex gap-2">
                            <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-yoga-500' : 'glass'" class="px-6 py-3 rounded-xl text-xs font-bold transition-all">All</button>
                            <button @click="filter = 'pending'" :class="filter === 'pending' ? 'bg-yellow-500' : 'glass'" class="px-6 py-3 rounded-xl text-xs font-bold transition-all">Pending</button>
                            <button @click="filter = 'paid'" :class="filter === 'paid' ? 'bg-green-500' : 'glass'" class="px-6 py-3 rounded-xl text-xs font-bold transition-all">Paid</button>
                        </div>
                        <input type="text" x-model="search" placeholder="Search booking..." class="w-full md:w-64 bg-white/5 border border-white/10 rounded-xl px-6 py-3 text-sm focus:ring-2 focus:ring-yoga-500 outline-none">
                    </div>

                    <div class="glass rounded-[3rem] overflow-hidden">
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white/5 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                                        <th class="px-8 py-6">Member</th>
                                        <th class="px-8 py-6">Class Session</th>
                                        <th class="px-8 py-6 text-center">Payment</th>
                                        <th class="px-8 py-6 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    <template x-for="b in filteredBookings" :key="b.id">
                                        <tr class="hover:bg-white/5 transition-all">
                                            <td class="px-8 py-6">
                                                <p class="font-bold text-sm" x-text="b.name"></p>
                                                <p class="text-[10px] text-gray-500" x-text="b.phone"></p>
                                            </td>
                                            <td class="px-8 py-6">
                                                <p class="font-bold text-xs" x-text="b.class_title"></p>
                                                <p class="text-[10px] text-gray-500" x-text="`${b.class_date} • ${b.class_time}`"></p>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <span :class="getPaymentClass(b.payment_status)" class="text-[9px] font-bold uppercase px-3 py-1 rounded-full border" x-text="b.payment_status"></span>
                                            </td>
                                            <td class="px-8 py-6 text-right">
                                                <div class="flex justify-end gap-2">
                                                    <button @click="openActionMenu(b)" class="bg-white/5 hover:bg-yoga-500 px-4 py-2 rounded-lg text-[10px] font-bold transition-all">Actions</button>
                                                    <a :href="`https://wa.me/${b.phone.replace(/[^0-9]/g, '')}`" target="_blank" class="bg-green-500/20 text-green-500 hover:bg-green-500 hover:text-white px-4 py-2 rounded-lg text-[10px] font-bold transition-all">WhatsApp</a>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Login & JS (Keep original logic but update state) -->
    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-dark-900">
            <div class="w-full max-w-md glass p-10 rounded-[3rem] text-center">
                <div class="w-16 h-16 yoga-gradient rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-8 shadow-xl">N</div>
                <h1 class="text-3xl font-display font-bold mb-2">Admin Login</h1>
                <p class="text-gray-400 text-sm mb-10">Protected Area</p>
                <form @submit.prevent="login()" class="space-y-6">
                    <input type="password" x-model="password" placeholder="Password" class="w-full bg-dark-800 border border-gray-700 rounded-2xl px-6 py-4 text-center outline-none">
                    <button type="submit" class="w-full yoga-gradient py-5 rounded-2xl font-bold">Login</button>
                </form>
            </div>
        </div>
    </template>

    <script src="js/api.js"></script>
    <script>
        function adminApp() {
            return {
                sidebarOpen: window.innerWidth > 1024,
                isLoggedIn: localStorage.getItem('yoga_admin_auth') === 'true',
                password: '',
                bookings: [],
                stats: { total_bookings: 0, total_paid: 0, total_pending: 0, revenue_est: 0, revenue_pending: 0, attendance_today: 0 },
                search: '',
                filter: 'all',
                lastRefresh: '-',

                init() {
                    if (this.isLoggedIn) this.startRefresh();
                },

                login() {
                    if (this.password === 'natha2024') {
                        this.isLoggedIn = true;
                        localStorage.setItem('yoga_admin_auth', 'true');
                        this.startRefresh();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Error', text: 'Wrong password' });
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('yoga_admin_auth');
                },

                async fetchData() {
                    try {
                        const [bRes, sRes] = await Promise.all([
                            fetch(`${API.URL}?action=admin_bookings`).then(r => r.json()),
                            fetch(`${API.URL}?action=dashboard_stats`).then(r => r.json())
                        ]);
                        if (bRes.success) this.bookings = bRes.data;
                        if (sRes.success && sRes.data) {
                            const data = sRes.data;
                            this.stats = {
                                total_bookings: data.total_bookings !== undefined ? data.total_bookings : 0,
                                total_paid: data.total_paid !== undefined ? data.total_paid : 0,
                                total_pending: data.total_pending !== undefined ? data.total_pending : 0,
                                revenue_est: data.revenue_est !== undefined ? data.revenue_est : (data.revenue !== undefined ? data.revenue : 0),
                                revenue_pending: data.revenue_pending !== undefined ? data.revenue_pending : (data.pending_revenue !== undefined ? data.pending_revenue : 0),
                                attendance_today: data.attendance_today !== undefined ? data.attendance_today : 0
                            };
                            
                            // Safe parsing to prevent NaN values
                            if (isNaN(this.stats.revenue_est)) this.stats.revenue_est = 0;
                            if (isNaN(this.stats.total_pending)) this.stats.total_pending = 0;
                            if (isNaN(this.stats.revenue_pending)) this.stats.revenue_pending = 0;
                        }
                        this.lastRefresh = new Date().toLocaleTimeString();
                    } catch (e) { console.error(e); }
                },

                startRefresh() {
                    this.fetchData();
                    setInterval(() => this.fetchData(), 30000);
                },

                get filteredBookings() {
                    return this.bookings.filter(b => {
                        const matchSearch = b.name.toLowerCase().includes(this.search.toLowerCase());
                        const matchFilter = this.filter === 'all' || b.payment_status === this.filter;
                        return matchSearch && matchFilter;
                    });
                },

                async openActionMenu(b) {
                    const { value: action } = await Swal.fire({
                        title: 'Quick Action',
                        background: '#1e293b', color: '#fff',
                        input: 'select',
                        inputOptions: { 'paid': 'Set Paid', 'confirmed': 'Confirm', 'cancelled': 'Cancel', 'checked_in': 'Manual Check-in' },
                        showCancelButton: true
                    });
                    if (action) this.processUpdate(b.id, action);
                },

                async processUpdate(id, action) {
                    Swal.fire({
                        title: 'Memproses...',
                        text: 'Memperbarui status booking',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); },
                        background: '#1e293b', color: '#fff'
                    });

                    try {
                        let type = action === 'checked_in' ? 'status' : 'payment_status';
                        const res = await fetch(`${API.URL}?action=update_status&booking_id=${id}&type=${type}&value=${action}`).then(r => r.json());
                        
                        if (res.success) {
                            await this.fetchData();
                            Swal.fire({
                                icon: 'success',
                                title: 'Berhasil!',
                                text: 'Status booking telah diperbarui.',
                                background: '#1e293b', color: '#fff',
                                confirmButtonColor: '#8b5cf6'
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Gagal!',
                                text: res.message || 'Gagal memperbarui status.',
                                background: '#1e293b', color: '#fff',
                                confirmButtonColor: '#ef4444'
                            });
                        }
                    } catch (e) {
                        console.error(e);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error!',
                            text: 'Terjadi kesalahan koneksi.',
                            background: '#1e293b', color: '#fff',
                            confirmButtonColor: '#ef4444'
                        });
                    }
                },

                getPaymentClass(s) {
                    if (s === 'paid') return 'bg-green-500/10 text-green-500 border-green-500/20';
                    if (s === 'pending') return 'bg-yellow-500/10 text-yellow-500 border-yellow-500/20';
                    return 'bg-gray-500/10 text-gray-500 border-gray-500/20';
                },

                formatCurrency(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(v); }
            }
        }
    </script>
</body>
</html>
