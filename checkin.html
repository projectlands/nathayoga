<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | Self Check-in</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: { 500: '#8b5cf6', 600: '#7c3aed' },
                        dark: { 900: '#0f172a', 800: '#1e293b' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .yoga-gradient { background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%); }
    </style>
</head>
<body class="bg-dark-900 text-white font-sans flex items-center justify-center min-h-screen p-6" x-data="selfCheckin()">

    <!-- Main Container -->
    <div class="w-full max-w-md glass p-8 rounded-[3rem] shadow-2xl relative overflow-hidden text-center">
        <!-- Decor -->
        <div class="absolute -top-10 -right-10 w-32 h-32 yoga-gradient opacity-10 blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 yoga-gradient opacity-10 blur-3xl"></div>

        <header class="mb-10">
            <div class="w-16 h-16 yoga-gradient rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-6 shadow-xl shadow-yoga-500/20 animate-bounce">N</div>
            <h1 class="text-3xl font-display font-bold mb-2">Self Check-in</h1>
            <p class="text-gray-400 text-sm">Selamat datang di Natha Yoga Studio</p>
        </header>

        <!-- Initializing / Loading State -->
        <div x-show="initializing" class="py-10 space-y-4">
            <div class="w-8 h-8 border-4 border-yoga-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">Memproses Token...</p>
        </div>

        <!-- Check-in Flow -->
        <div x-show="!initializing && !success" x-transition>
            <!-- Auto-detected User -->
            <div x-show="savedName" class="mb-8">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-[0.2em] mb-4">Halo, Selamat Datang</p>
                <h2 class="text-2xl font-bold text-yoga-400" x-text="savedName"></h2>
                <p class="text-xs text-gray-500 mt-2" x-text="savedPhone"></p>
                
                <button @click="processCheckin()" :disabled="loading" class="w-full yoga-gradient py-5 rounded-[1.5rem] font-bold text-white shadow-xl shadow-yoga-500/20 active:scale-95 transition-all mt-10 flex items-center justify-center gap-3">
                    <span x-show="loading" class="animate-spin border-2 border-white border-t-transparent rounded-full h-5 w-5"></span>
                    <span x-text="loading ? 'Memproses...' : 'Konfirmasi Kehadiran'"></span>
                </button>
                <button @click="savedName = ''" class="mt-4 text-xs text-gray-600 hover:text-gray-400">Bukan saya? Input nomor manual</button>
            </div>

            <!-- Manual Input Form -->
            <div x-show="!savedName" class="space-y-6 text-left" x-transition>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Nomor WhatsApp</label>
                    <input type="tel" x-model="inputPhone" placeholder="0812..." class="w-full bg-black/20 border border-gray-700 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-yoga-500 transition-all outline-none">
                </div>
                <button @click="processCheckin()" :disabled="loading" class="w-full yoga-gradient py-5 rounded-[1.5rem] font-bold text-white shadow-xl shadow-yoga-500/20 active:scale-95 transition-all flex items-center justify-center gap-3">
                    <span x-show="loading" class="animate-spin border-2 border-white border-t-transparent rounded-full h-5 w-5"></span>
                    <span x-text="loading ? 'Memproses...' : 'Cek & Check-in'"></span>
                </button>
            </div>
        </div>

        <!-- Success State -->
        <div x-show="success" x-transition class="py-6">
            <div class="w-20 h-20 bg-green-500/10 text-green-500 border border-green-500/20 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">✓</div>
            <h2 class="text-2xl font-bold mb-2">Check-in Berhasil!</h2>
            <p class="text-gray-400 text-sm mb-8 leading-relaxed">Terima kasih <span class="text-yoga-400 font-bold" x-text="savedName"></span>. Silakan masuk ke dalam studio dan nikmati latihan Anda.</p>
            <button @click="window.location.href='index.html'" class="glass px-8 py-4 rounded-2xl font-bold text-sm">Kembali ke Home</button>
        </div>

    </div>

    <script>
        function selfCheckin() {
            return {
                apiUrl: "https://script.google.com/macros/s/AKfycbwmNivgJ0d3SnKggO4tfRx3pbQ8sQqb7duu4CceUKS2CWhQHrpBMPYzn2uKi4_fBzUwIQ/exec",
                token: '',
                initializing: true,
                loading: false,
                success: false,
                savedName: localStorage.getItem('yoga_name') || '',
                savedPhone: localStorage.getItem('yoga_phone') || '',
                inputPhone: '',

                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.token = urlParams.get('token');

                    if (!this.token) {
                        await Swal.fire({ icon: 'error', title: 'Token Hilang', text: 'Silakan scan ulang QR Code di studio.', background: '#1e293b', color: '#fff' });
                        window.location.href = 'index.html';
                        return;
                    }

                    setTimeout(() => { this.initializing = false; }, 1000);
                },

                async processCheckin() {
                    const phone = this.savedName ? this.savedPhone : this.inputPhone;
                    if (!phone) return Swal.fire({ icon: 'warning', title: 'Data Kurang', text: 'Masukkan nomor WhatsApp Anda.', background: '#1e293b', color: '#fff' });

                    this.loading = true;
                    try {
                        const res = await fetch(`${this.apiUrl}?action=checkin_self&token=${this.token}&phone=${phone}`).then(r => r.json());
                        
                        if (res.success) {
                            if (res.data && res.data.name) this.savedName = res.data.name;
                            this.success = true;
                            // Feedback
                            if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
                        } else {
                            Swal.fire({ icon: 'error', title: 'Gagal Check-in', text: res.message, background: '#1e293b', color: '#fff' });
                        }
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'Network Error', text: 'Gagal terhubung ke server.', background: '#1e293b', color: '#fff' });
                    } finally { this.loading = false; }
                }
            }
        }
    </script>
</body>
</html>
