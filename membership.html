<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | My Membership</title>

    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta property="og:image" content="logo.jpg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: {
                            50: '#FDFBFD',
                            100: '#F9F3F9',
                            200: '#F4E7F4',
                            300: '#E9D1EA',
                            400: '#DFBBDF',
                            500: '#D8B4E2',
                            600: '#C08BCF',
                            700: '#A765B9',
                            800: '#7B6291',
                            900: '#2D3142'
                        },
                        dark: {
                            900: '#121016',
                            800: '#1a1822',
                            700: '#252230'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.06)',
                        'glow': '0 10px 20px -5px rgba(216, 180, 226, 0.4)'
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #FDFBFD; color: #2D3142; }
        .glass { background: #FFFFFF; border: none; box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05); }
        .dark .glass { background: rgba(30, 28, 38, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5); }
        .yoga-gradient { background: linear-gradient(135deg, #FFB6C1 0%, #D8B4E2 100%); color: white; }
    </style>
</head>
<body class="bg-yoga-50 dark:bg-dark-900 text-yoga-900 dark:text-gray-100 font-sans min-h-screen pb-20 transition-colors duration-500" x-data="membershipApp()">

    <!-- Header -->
    <header class="p-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-display font-bold">My Membership</h1>
            <p class="text-gray-400 text-xs">Kelola paket dan sesi yoga Anda</p>
        </div>
        <a href="index.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-lg">✕</a>
    </header>

    <main class="px-6 space-y-6">
        
        <!-- Search Section (If not logged in via storage) -->
        <template x-if="!phone">
            <div class="glass p-8 rounded-[2.5rem] text-center">
                <p class="text-sm text-gray-400 mb-6">Masukkan nomor WhatsApp Anda untuk melihat membership aktif</p>
                <div class="flex gap-2">
                    <input type="tel" x-model="searchPhone" placeholder="0812..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                    <button @click="loadMemberships()" class="bg-yoga-500 px-6 rounded-2xl font-bold">Cek</button>
                </div>
            </div>
        </template>

        <!-- Active Memberships -->
        <template x-if="memberships.length > 0">
            <div class="space-y-4">
                <template x-for="m in memberships" :key="m.id">
                    <div class="glass p-6 rounded-[2rem] border-l-4 border-l-yoga-500 flex flex-col md:flex-row justify-between gap-6 shadow-soft bg-white dark:bg-dark-800 transition-all hover:shadow-glow cursor-pointer relative overflow-hidden" @click="showInfo(m)">
                        <div>
                            <span class="text-[10px] font-bold text-yoga-500 uppercase tracking-widest block mb-1"
                                x-text="m.membership_type === 'session' ? 'Session Package' : 'Unlimited Member'"></span>
                            <h4 class="text-lg font-bold leading-tight mb-2 text-yoga-900 dark:text-white font-display" x-text="m.package_title"></h4>
                            <div class="flex flex-col gap-1">
                                <p class="text-xs text-gray-500">Berlaku s/d: <span class="font-bold" x-text="formatDate(m.expired_at)"></span></p>
                            </div>
                        </div>
                        <div class="flex flex-col items-start md:items-end justify-between gap-4">
                            <span class="bg-green-50 text-green-600 dark:bg-green-500/10 dark:text-green-400 text-[10px] font-bold px-3 py-1 rounded-full" x-text="m.status"></span>
                            <div class="bg-yoga-50 dark:bg-dark-700 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                <span class="text-[10px] text-gray-500 uppercase font-bold">Sisa</span>
                                <span class="text-sm font-bold text-yoga-600" x-text="m.membership_type === 'session' ? m.remaining_sessions : '∞'"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- Empty State -->
        <template x-if="phone && memberships.length === 0 && !loading">
            <div class="py-20 text-center">
                <div class="w-20 h-20 bg-white dark:bg-dark-800 rounded-full flex items-center justify-center mx-auto mb-6 shadow-soft text-3xl">🧘</div>
                <h3 class="text-xl font-bold mb-2 font-display text-yoga-900 dark:text-white">Belum ada paket aktif</h3>
                <p class="text-gray-500 text-sm max-w-xs mx-auto mb-8">Anda belum memiliki membership aktif. Silakan hubungi admin untuk aktivasi paket.</p>
                <a href="https://wa.me/6281234567890" class="yoga-gradient px-8 py-4 rounded-full font-bold text-white text-sm inline-block shadow-glow hover:scale-105 transition-all">Beli Paket Membership</a>
            </div>
        </template>

    </main>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 inset-x-0 z-50 px-6 pb-6 pointer-events-none">
        <div class="max-w-md mx-auto h-[4.5rem] bg-white dark:bg-dark-800 rounded-full flex items-center justify-around px-4 pointer-events-auto shadow-soft border border-gray-50 dark:border-dark-700">
            <a href="index.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500">
                <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </div>
            </a>
            <a href="index.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500">
                <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
            </a>
            <a href="membership.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-yoga-500 -translate-y-2">
                <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors yoga-gradient shadow-glow text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                </div>
                <span class="text-[9px] font-bold">Member</span>
            </a>
            <a href="index.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500">
                <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </a>
            <a href="index.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-full transition-all text-gray-400 hover:text-yoga-500">
                <div class="w-10 h-10 flex items-center justify-center rounded-full mb-0.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </a>
        </div>
    </div>

    <script>
        function membershipApp() {
            return {
                phone: localStorage.getItem('yoga_phone') || '',
                searchPhone: '',
                memberships: [],
                loading: false,

                init() {
                    if (this.phone) {
                        this.loadMemberships();
                    }
                },

                async loadMemberships() {
                    const phoneToUse = this.phone || this.searchPhone;
                    if (!phoneToUse) return;
                    
                    this.loading = true;
                    try {
                        const res = await fetch(`${API.URL}?action=user_memberships&phone=${phoneToUse.replace(/[^0-9]/g, "")}`).then(r => r.json());
                        if (res.success) {
                            this.memberships = res.data;
                            if (this.searchPhone) {
                                this.phone = this.searchPhone;
                                localStorage.setItem('yoga_phone', this.phone);
                            }
                        }
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'Koneksi Gagal', text: 'Gagal memuat data membership.', background: '#1e293b', color: '#fff' });
                    } finally { this.loading = false; }
                },

                logout() {
                    this.phone = '';
                    this.memberships = [];
                    localStorage.removeItem('yoga_phone');
                    localStorage.removeItem('yoga_name');
                },

                showInfo(m) {
                    Swal.fire({
                        title: m.package_title,
                        html: `
                            <div class="text-left space-y-4 text-sm mt-4">
                                <div class="flex justify-between border-b border-white/5 pb-2">
                                    <span class="text-gray-400">Dimulai Pada</span>
                                    <span class="font-bold">${this.formatDate(m.started_at)}</span>
                                </div>
                                <div class="flex justify-between border-b border-white/5 pb-2">
                                    <span class="text-gray-400">ID Member</span>
                                    <span class="font-bold">${m.id}</span>
                                </div>
                                <div class="bg-yoga-500/10 p-4 rounded-xl text-yoga-400 text-xs italic">
                                    Sesi akan otomatis terpotong setiap kali Anda melakukan booking kelas melalui sistem.
                                </div>
                            </div>
                        `,
                        background: '#1e293b', color: '#fff',
                        confirmButtonColor: '#8b5cf6',
                        customClass: { popup: 'rounded-[2rem]' }
                    });
                },

                formatDate(iso) {
                    if (!iso) return '-';
                    return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
