<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natha Yoga | My Membership</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        yoga: { 500: '#8b5cf6', 600: '#7c3aed', 400: '#a78bfa' },
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .yoga-gradient { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); }
    </style>
</head>
<body class="font-sans min-h-screen pb-20" x-data="membershipApp()">

    <!-- Header -->
    <header class="p-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-display font-bold">My Membership</h1>
            <p class="text-gray-400 text-xs">Kelola paket dan sesi yoga Anda</p>
        </div>
        <a href="index.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-lg">✕</a>
    </header>

    <main class="px-6 space-y-6">
        
        <!-- Search Section (If not logged in via storage) -->
        <template x-if="!phone">
            <div class="glass p-8 rounded-[2.5rem] text-center">
                <p class="text-sm text-gray-400 mb-6">Masukkan nomor WhatsApp Anda untuk melihat membership aktif</p>
                <div class="flex gap-2">
                    <input type="tel" x-model="searchPhone" placeholder="0812..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-yoga-500 transition-all">
                    <button @click="loadMemberships()" class="bg-yoga-500 px-6 rounded-2xl font-bold">Cek</button>
                </div>
            </div>
        </template>

        <!-- Active Memberships -->
        <template x-if="memberships.length > 0">
            <div class="space-y-4">
                <template x-for="m in memberships" :key="m.id">
                    <div class="glass p-8 rounded-[3rem] relative overflow-hidden group">
                        <!-- Decorative Gradient -->
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-yoga-500/20 blur-3xl group-hover:bg-yoga-500/40 transition-all"></div>
                        
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="bg-yoga-500/20 text-yoga-400 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-yoga-500/30" x-text="m.membership_type === 'session' ? 'Session Package' : 'Unlimited Member'"></span>
                                <h3 class="text-2xl font-display font-bold mt-3" x-text="m.package_title"></h3>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-gray-500 uppercase font-bold">Status</p>
                                <p class="text-green-500 font-bold uppercase text-xs" x-text="m.status"></p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white/5 p-4 rounded-2xl">
                                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Sisa Sesi</p>
                                <h4 class="text-2xl font-display font-bold" x-text="m.membership_type === 'session' ? m.remaining_sessions : '∞'">0</h4>
                            </div>
                            <div class="bg-white/5 p-4 rounded-2xl">
                                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Berlaku Hingga</p>
                                <h4 class="text-sm font-bold mt-2" x-text="formatDate(m.expired_at)">-</h4>
                            </div>
                        </div>

                        <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center">
                            <p class="text-[10px] text-gray-500">ID: <span class="font-mono" x-text="m.id"></span></p>
                            <button @click="showInfo(m)" class="text-yoga-400 text-xs font-bold underline">Detail Info</button>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- Empty State -->
        <template x-if="phone && memberships.length === 0 && !loading">
            <div class="py-20 text-center">
                <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🧘</div>
                <h3 class="text-xl font-bold mb-2">Belum ada paket aktif</h3>
                <p class="text-gray-500 text-sm max-w-xs mx-auto mb-8">Anda belum memiliki membership aktif. Silakan hubungi admin untuk aktivasi paket.</p>
                <a href="https://wa.me/6281234567890" class="yoga-gradient px-8 py-4 rounded-2xl font-bold text-sm inline-block shadow-xl">Beli Paket Membership</a>
            </div>
        </template>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-4 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-bold uppercase">Home</span>
            </a>
            <a href="membership.html" class="flex flex-col items-center gap-1 text-yoga-500">
                <span class="text-xl">💎</span>
                <span class="text-[10px] font-bold uppercase">Member</span>
            </a>
            <button @click="logout()" x-show="phone" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="text-xl">🚪</span>
                <span class="text-[10px] font-bold uppercase">Logout</span>
            </button>
        </div>
    </nav>

    <script>
        function membershipApp() {
            return {
                phone: localStorage.getItem('yoga_phone') || '',
                searchPhone: '',
                memberships: [],
                loading: false,

                init() {
                    if (this.phone) {
                        this.loadMemberships();
                    }
                },

                async loadMemberships() {
                    const phoneToUse = this.phone || this.searchPhone;
                    if (!phoneToUse) return;
                    
                    this.loading = true;
                    try {
                        const res = await fetch(`${API.URL}?action=user_memberships&phone=${phoneToUse.replace(/[^0-9]/g, "")}`).then(r => r.json());
                        if (res.success) {
                            this.memberships = res.data;
                            if (this.searchPhone) {
                                this.phone = this.searchPhone;
                                localStorage.setItem('yoga_phone', this.phone);
                            }
                        }
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'Koneksi Gagal', text: 'Gagal memuat data membership.', background: '#1e293b', color: '#fff' });
                    } finally { this.loading = false; }
                },

                logout() {
                    this.phone = '';
                    this.memberships = [];
                    localStorage.removeItem('yoga_phone');
                    localStorage.removeItem('yoga_name');
                },

                showInfo(m) {
                    Swal.fire({
                        title: m.package_title,
                        html: `
                            <div class="text-left space-y-4 text-sm mt-4">
                                <div class="flex justify-between border-b border-white/5 pb-2">
                                    <span class="text-gray-400">Dimulai Pada</span>
                                    <span class="font-bold">${this.formatDate(m.started_at)}</span>
                                </div>
                                <div class="flex justify-between border-b border-white/5 pb-2">
                                    <span class="text-gray-400">ID Member</span>
                                    <span class="font-bold">${m.id}</span>
                                </div>
                                <div class="bg-yoga-500/10 p-4 rounded-xl text-yoga-400 text-xs italic">
                                    Sesi akan otomatis terpotong setiap kali Anda melakukan booking kelas melalui sistem.
                                </div>
                            </div>
                        `,
                        background: '#1e293b', color: '#fff',
                        confirmButtonColor: '#8b5cf6',
                        customClass: { popup: 'rounded-[2rem]' }
                    });
                },

                formatDate(iso) {
                    if (!iso) return '-';
                    return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
